t}}\">Reset to yesterday<\/button>\n<button type=\"button\" class=\"btn btn-p\" onClick=\"{{save}}\"><svg class=\"ic\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>Save today’s weigh-in &amp; recalculate curves<\/button>\n<\/div>\n<\/div>\n<\/section>\n\n<\/div>\n<\/main>\n<\/div>\n",C:(function(DCLogic){

      { n: 'Cobalt', sex: 'Male', c: '#2563EB', t: '#DBEAFE', k: '#1E40AF', bw: 452, y: 858, td: 905, note: '' },
      { n: 'Olive', sex: 'Female', c: '#65A30D', t: '#ECFCCB', k: '#3F6212', bw: 421, y: 772, td: 818, note: 'Ears starting to open' },
      { n: 'Sunny', sex: 'Male', c: '#EAB308', t: '#FEF9C3', k: '#854D0E', bw: 398, y: 747, td: 742, note: 'Weak latch at 06:00 — bottle top-up' },
      { n: 'Lavender', sex: 'Female', c: '#8B5CF6', t: '#EDE9FE', k: '#5B21B6', bw: 410, y: 748, td: 795, note: '' },
      { n: 'Amber', sex: 'Male', c: '#EA580C', t: '#FFEDD5', k: '#9A3412', bw: 429, y: 771, td: 818, note: 'First wobbly steps' }

  renderVals() {

    for (let d = 0; d <= 14; d++) { up.push(X(d) + ',' + Y(425 * Math.pow(1.065, d)).toFixed(1)); lo.unshift(X(d) + ',' + Y(425 * Math.pow(1.045, d)).toFixed(1)); }

      lines, ticks, xlabels, legend, rows, isoDots, entered,
      bandPts: up.concat(lo).join(' '),
      bandLabelY: (Y(425 * Math.pow(1.055, 14)) + 4).toFixed(1),
      band: s.band,
      hasIso: !!isoP,
      isoLabel: isoP ? isoP.n + ' ' + fw(isoP.arr[14]) : '',

      curveSub: isoP ? 'Isolated: ' + isoP.n + ' · click a chip to switch, or Show all' : 'All 6 pups · lines colored by collar · click a chip to isolate',

      dark: s.dark,

      themeTrack: s.dark ? '#0F766E' : '#CBD5E1',
      themeKnob: s.dark ? '18px' : '2px'
    };
  }
}

nt-size: 16px\">Nursing &amp; formula supplement<\/strong>\n<span style=\"font-size: 13px; color: #115E59; font-weight: 600\">Weeks 0–3<\/span>\n<span style=\"font-size: 13px; color: #334155; line-height: 1.5\">Dam nursing on demand; bottle top-ups for slow gainers. Dam fed 3× her normal ration.<\/span>\n<\/li>\n<li style=\"border: 1px solid #E2E8F0; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"width: 32px; height: 32px; border-radius: 50%; background: #F1F5F9; color: #334155; font-weight: 700; display: flex; align-items: center; justify-content: center\">2<\/span><span style=\"font-size: 12px; font-weight: 700; color: #475569; background: #F1F5F9; border-radius: 999px; padding: 4px 10px\">Next · in 7 days<\/span><\/div>\n<strong style=\"font-size: 16px\">Weaning gruel &amp; puppy mush<\/strong>\n<span style=\"font-size: 13px; color: #475569; font-weight: 600\">Weeks 3–5<\/span>\n<span style=\"font-size: 13px; color: #334155; line-height: 1.5\">Soaked kibble + goat milk in shallow pans, 4 meals a day, nursing tapering.<\/span>\n<\/li>\n<li style=\"border: 1px solid #E2E8F0; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"width: 32px; height: 32px; border-radius: 50%; background: #F1F5F9; color: #334155; font-weight: 700; display: flex; align-items: center; justify-content: center\">3<\/span><span style=\"font-size: 12px; font-weight: 700; color: #475569; background: #F1F5F9; border-radius: 999px; padding: 4px 10px\">Later<\/span><\/div>\n<strong style=\"font-size: 16px\">Solid puppy kibble<\/strong>\n<span style=\"font-size: 13px; color: #475569; font-weight: 600\">Weeks 5–8<\/span>\n<span style=\"font-size: 13px; color: #334155; line-height: 1.5\">Dry large-breed puppy kibble, 3–4 meals a day, f -size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 10px; background: {{s.pillBg}}; color: {{s.pillInk}}; white-space: nowrap\">{{s.pill}}<\/span>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n<div style=\"background: #F8FAFC; border-radius: 10px; padding: 10px 12px\"><div style=\"font-size: 12px; color: #64748B\">Last fed<\/div><div style=\"font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums\">{{s.last}}<\/div><div style=\"font-size: 12px; color: #475569\">{{s.ago}} ago<\/div><\/div>\n<div style=\"background: {{s.dueBg}}; border-radius: 10px; padding: 10px 12px\"><div style=\"font-size: 12px; color: {{s.dueInk}}\">{{s.dueLabel}}<\/div><div style=\"font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{s.dueInk}}\">{{s.countdown}}<\/div><div style=\"font-size: 12px; color: {{s.dueInk}}\">at {{s.dueAt}}<\/div><\/div>\n<\/div>\n<div style=\"height: 6px; border-radius: 999px; background: #F1F5F9; overflow: hidden\"><div style=\"height: 100%; width: {{s.pct}}; background: {{s.c}}\"><\/div><\/div>\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px\">\n<span style=\"font-size: 13px; color: #475569\">{{s.dose}}<\/span>\n<button type=\"button\" class=\"btn btn-s\" onClick=\"{{s.fed}}\" style=\"min-height: 40px; padding: 0 14px\">Mark fed now<\/button>\n<\/div>\n<\/div>\n<\/article>\n<\/sc-for>\n<div style=\"border: 1px dashed #CBD5E1; border-radius: 12px; padding: 16px; font-size: 13px; color: #475569; line-height: 1.55\">Pups are flagged for supplementing automatically when 24h gain is under 5% or weight drops at any weigh-in.<\/div>\n<\/aside>\n\n<\/div>\n\n<\/div>\n<\/main>\n\n<sc-if value=\"{{modal}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,0.45); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box\">\n<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-h\" style=\"width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; background: #FFFFFF; border-radius: 16px; box-shadow: 0 24px 64px rgba(15,23,42,0.3); padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<h2 id=\"modal-h\" style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700\">Log feeding session<\/h2>\n<button type=\"button\" class=\"star\" onClick=\"{{closeModal}}\" aria-label=\"Close\"><svg class=\"ic\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg><\/button>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n<label class=\"fld\">Time<input class=\"in\" type=\"time\" value=\"{{f.time}}\" onChange=\"{{fTime}}\"/><\/label>\n<label class=\"fld\">Puppy<select class=\"in\" value=\"{{f.pup}}\" onChange=\"{{fPup}}\"><option>Whole litter<\/option><option>Ruby<\/option><option>Cobalt<\/option><option>Olive<\/option><option>Sunny<\/option><option>Lavender<\/option><option>Amber<\/option><\/select><\/label>\n<label class=\"fld\">Amount<input class=\"in\" type=\"text\" inputmode=\"decimal\" value=\"{{f.amt}}\" onChange=\"{{fAmt}}\" placeholder=\"e.g. 15\"/><\/label>\n<label class=\"fld\">Unit<select class=\"in\" value=\"{{f.unit}}\" onChange=\"{{fUnit}}\"><option>ml<\/option><option>g<\/option><option>min nursing<\/option><\/select><\/label>\n<label class=\"fld\" style=\"grid-column: 1 / -1\">Formula brand<select class=\"in\" value=\"{{f.formula}}\" onChange=\"{{fFormula}}\"><option>Esbilac<\/option><option>PetLac<\/option><option>Breeder’s Edge Foster Care<\/option><option>Goat milk<\/option><option>Dam (nursing)<\/option><\/select><\/label>\n<\/div>\n<div class=\"fld\">Nursing quality\n<div style=\"display: flex; gap: 0\">\n<sc-for list=\"{{fStars}}\" as=\"s\" hint-placeholder-count=\"5\">\n<button type=\"button\" class=\"star\" onClick=\"{{s.set}}\" aria-label=\"{{s.label}}\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"fill: {{s.f}}\"><polygon points=\"12 2.5 15 9 22 9.7 16.7 14.3 18.2 21 12 17.5 5.8 21 7.3 14.3 2 9.7 9 9\"><\/polygon><\/svg><\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<label class=\"fld\">Caregiver notes<textarea class=\"in\" rows=\"3\" value=\"{{f.notes}}\" onChange=\"{{fNotes}}\" placeholder=\"Latch, appetite, anything unusual\" style=\"padding: 10px 12px; min-height: 84px; resize: vertical\"><\/textarea><\/label>\n<div style=\"display: flex; justify-content: flex-end; gap: 10px\">\n<button type=\"button\" class=\"btn btn-s\" onClick=\"{{closeModal}}\">Cancel<\/button>\n<button type=\"button\" class=\"btn btn-p\" onClick=\"{{saveLog}}\">Save session<\/button>\n<\/div>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<\/div>\n",C:(function(DCLogic){
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.C = {
      'Whole litter': { c: '#0F766E', t: '#F0FDFA', k: '#115E59' },
      Ruby: { c: '#DC2626', t: '#FEE2E2', k: '#991B1B' },
      Cobalt: { c: '#2563EB', t: '#DBEAFE', k: '#1E40AF' },
      Olive: { c: '#65A30D', t: '#ECFCCB', k: '#3F6212' },
      Sunny: { c: '#EAB308', t: '#FEF9C3', k: '#854D0E' },
      Lavender: { c: '#8B5CF6', t: '#EDE9FE', k: '#5B21B6' },
      Amber: { c: '#EA580C', t: '#FFEDD5', k: '#9A3412' }
    };
    this.start = Date.now();
    this.base = 13 * 3600 + 42 * 60;
    this.state = {
      litterOpen: false, dark: false, modal: false, tick: 0,
      lastFed: { Sunny: 12 * 3600, Lavender: 12 * 3600 + 20 * 60 },
      logs: [
        { time: '00:30', pup: 'Whole litter', amt: 20, unit: 'min nursing', formula: 'Dam (nursing)', rating: 5, notes: 'All six latched, Luna settled quickly' },
        { time: '03:00', pup: 'Sunny', amt: 12, unit: 'ml', formula: 'Esbilac', rating: 3, notes: 'Took the bottle slowly' },
        { time: '06:00', pup: 'Sunny', amt: 14, unit: 'ml', formula: 'Esbilac', rating: 2, notes: 'Weak latch on dam, full bottle top-up' },
        { time: '06:15', pup: 'Lavender', amt: 10, unit: 'ml', formula: 'Esbilac', rating: 4, notes: 'Finished easily' },
        { time: '07:30', pup: 'Whole litter', amt: 25, unit: 'min nursing', formula: 'Dam (nursing)', rating: 4, notes: 'Cobalt pushing others off the back teats' },
        { time: '09:00', pup: 'Sunny', amt: 15, unit: 'ml', formula: 'Esbilac', rating: 4, notes: 'Stronger suck reflex' },
        { time: '12:00', pup: 'Sunny', amt: 15, unit: 'ml', formula: 'Esbilac', rating: 4, notes: 'Burped well, content' },
        { time: '12:20', pup: 'Lavender', amt: 10, unit: 'ml', formula: 'Esbilac', rating: 5, notes: '' }
      ],
      f: this.blank()
    };
  }
  blank() { return { time: '13:45', pup: 'Sunny', amt: '15', unit: 'ml', formula: 'Esbilac', rating: 4, notes: '' }; }
  componentDidMount() { this.timer = setInterval(() => this.setState({ tick: Math.floor((Date.now() - this.start) / 1000) }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const s = this.state;
    const now = this.base + s.tick;
    const hm = t => { t = ((t % 86400) + 86400) % 86400; return String(Math.floor(t / 3600)).padStart(2, '0') + ':' + String(Math.floor(t % 3600 / 60)).padStart(2, '0'); };
    const dur = t => { const a = Math.abs(t); const h = Math.floor(a / 3600), m = Math.floor(a % 3600 / 60), sec = a % 60; return (h ? h + 'h ' : '') + String(m).padStart(2, '0') + 'm ' + String(sec).padStart(2, '0') + 's'; };
    const stars = r => [1, 2, 3, 4, 5].map(i => ({ f: i <= r ? '#D97706' : '#E2E8F0' }));
    const logs = s.logs.slice().sort((a, b) => a.time < b.time ? -1 : 1).map(l => Object.assign({}, l, this.C[l.pup] || this.C['Whole litter'], {
      amt: l.unit === 'min nursing' ? 'Nursed ' + l.amt + ' min' : l.amt + ' ' + l.unit,
      stars: stars(l.rating),
      rowBg: l.fresh ? '#F0FDFA' : 'transparent',
      notes: l.notes || '—'
    }));
    const formulaTotal = s.logs.filter(l => l.unit === 'ml').reduce((a, l) => a + Number(l.amt || 0), 0);
    const plans = [
      { n: 'Sunny', plan: 'Bottle every 3 h · Esbilac', every: 3 * 3600, dose: '15 ml per feed · weigh before & after' },
      { n: 'Lavender', plan: 'Top-up twice daily · Esbilac', every: 6 * 3600, dose: '10 ml after dam nursing' }
    ];
    const supps = plans.map(p => {
      const last = s.lastFed[p.n];
      const due = last + p.every;
      const left = due - now;
      const over = left < 0;
      const soon = !over && left < 1800;
      const col = this.C[p.n];
      return Object.assign({}, col, p, {
        init: p.n[0],
        last: hm(last), ago: dur(now - last).replace(/ \d+s$/, ''),
        dueAt: hm(due),
        dueLabel: over ? 'Overdue by' : 'Next feed in',
        countdown: dur(left),
        dueBg: over ? '#FEE2E2' : soon ? '#FEF3C7' : '#F0FDFA',
        dueInk: over ? '#991B1B' : soon ? '#92400E' : '#115E59',
        border: over ? '#FCA5A5' : '#E2E8F0',
        pill: p.n === 'Sunny' ? 'Priority' : 'Monitor',
        pillBg: p.n === 'Sunny' ? '#FEE2E2' : '#F1F5F9',
        pillInk: p.n === 'Sunny' ? '#991B1B' : '#334155',
        pct: Math.max(0, Math.min(100, (now - last) / p.every * 100)).toFixed(1) + '%',
        fed: () => {
          const n = this.base + this.state.tick;
          this.setState({
            lastFed: Object.assign({}, this.state.lastFed, { [p.n]: n }),
            logs: this.state.logs.concat([{ time: hm(n), pup: p.n, amt: p.n === 'Sunny' ? 15 : 10, unit: 'ml', formula: 'Esbilac', rating: 4, notes: 'Logged from supplement card', fresh: true }])
          });
        }
      });
    });
    const setF = k => e => this.setState({ f: Object.assign({}, this.state.f, { [k]: e.target.value }) });
    return {
      clock: hm(now),
      logs, logCount: s.logs.length, formulaTotal, supps,
      modal: s.modal, f: s.f,
      fTime: setF('time'), fPup: setF('pup'), fAmt: setF('amt'), fUnit: setF('unit'), fFormula: setF('formula'), fNotes: setF('notes'),
      fStars: [1, 2, 3, 4, 5].map(i => ({ f: i <= s.f.rating ? '#D97706' : '#E2E8F0', label: i + ' star' + (i > 1 ? 's' : ''), set: () => this.setState({ f: Object.assign({}, this.state.f, { rating: i }) }) })),
      openModal: () => this.setState({ modal: true, f: Object.assign(this.blank(), { time: hm(this.base + this.state.tick) }) }),
      closeModal: () => this.setState({ modal: false }),
      saveLog: () => {
        const f = this.state.f;
        const upd = { modal: false, logs: this.state.logs.concat([Object.assign({}, f, { amt: f.amt || 0, fresh: true })]) };
        if (f.unit === 'ml' && this.state.lastFed[f.pup] !== undefined) {
          const p = f.time.split(':');
          upd.lastFed = Object.assign({}, this.state.lastFed, { [f.pup]: Number(p[0]) * 3600 + Number(p[1]) * 60 });
        }
        this.setState(upd);
      },
      litterOpen: s.litterOpen,
      sbOpen: this.state.navOpen ? 'open' : '',
      toggleNav: () => this.setState({ navOpen: !this.state.navOpen }),
      closeNav: () => this.setState({ navOpen: false }),
      toggleLitter: () => this.setState({ litterOpen: !this.state.litterOpen }),
      dark: s.dark,
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
      themeTrack: s.dark ? '#0F766E' : '#CBD5E1',
      themeKnob: s.dark ? '18px' : '2px'
    };
  }
}

 12px\">\n<span style=\"width: 44px; height: 44px; border-radius: 12px; background: {{m.iconBg}}; color: {{m.iconInk}}; display: flex; align-items: center; justify-content: center; flex: none\"><svg class=\"ic\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{m.icon}}\"><\/path><\/svg><\/span>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"><strong style=\"font-size: 16px\">{{m.title}}<\/strong><span style=\"font-size: 13px; color: #475569\">{{m.window}}<\/span><\/div>\n<span style=\"font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{m.countInk}}\">{{m.count}}/6<\/span>\n<\/div>\n<div style=\"height: 6px; border-radius: 999px; background: #F1F5F9; overflow: hidden\"><div style=\"height: 100%; width: {{m.pct}}; background: #0F766E\"><\/div><\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px\">\n<sc-for list=\"{{m.pups}}\" as=\"p\" hint-placeholder-count=\"6\">\n<label class=\"ck\"><input type=\"checkbox\" checked=\"{{p.done}}\" onChange=\"{{p.toggle}}\"/><span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{p.c}}; flex: none\"><\/span><span style=\"flex: 1; font-weight: 600\">{{p.n}}<\/span><span style=\"color: {{p.dayInk}}; font-variant-numeric: tabular-nums\">{{p.day}}<\/span><\/label>\n<\/sc-for>\n<\/div>\n<\/article>\n<\/sc-for>\n<\/div>\n<\/section>\n\n<\/div>\n<\/main>\n\n<sc-if value=\"{{modal}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,0.45); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box\">\n<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bm-h\" style=\"width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; background: #FFFFFF; border-radius: 16px; box-shadow: 0 24px 64px rgba(15,23,42,0.3); padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><h2 id=\"bm-h\" style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700\">Log litter vaccine / deworming<\/h2><span style=\"font-size: 13px; color: #64748B\">Applies one lot and signature to every selected pup<\/span><\/div>\n<button type=\"button\" class=\"x\" onClick=\"{{closeModal}}\" aria-label=\"Close\"><svg class=\"ic\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg><\/button>\n<\/div>\n<label class=\"fld\">Protocol item<select class=\"in\" value=\"{{f.item}}\" onChange=\"{{fItem}}\"><sc-for list=\"{{itemOpts}}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{o.v}}\">{{o.label}}<\/option><\/sc-for><\/select><\/label>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n<label class=\"fld\">Batch / lot #<input class=\"in\" type=\"text\" value=\"{{f.lot}}\" onChange=\"{{fLot}}\" placeholder=\"e.g. PY-2291\"/><\/label>\n<label class=\"fld\">Date given<input class=\"in\" type=\"date\" value=\"{{f.date}}\" onChange=\"{{fDate}}\"/><\/label>\n<\/div>\n<label class=\"fld\">Administering vet / signer<input class=\"in\" type=\"text\" value=\"{{f.vet}}\" onChange=\"{{fVet}}\"/><\/label>\n<div class=\"fld\">Apply to\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; border: 1px solid #E2E8F0; border-radius: 10px; padding: 6px\">\n<sc-for list=\"{{applyPups}}\" as=\"p\" hint-placeholder-count=\"6\">\n<label class=\"ck\" style=\"font-weight: 500\"><input type=\"checkbox\" checked=\"{{p.on}}\" onChange=\"{{p.toggle}}\"/><span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{p.c}}\"><\/span>{{p.n}}<\/label>\n<\/sc-for>\n<\/div>\n<\/div>\n<label class=\"ck\" style=\"border: 1px solid #E2E8F0; border-radius: 10px; padding: 10px 12px; font-weight: 500; color: #334155\"><input type=\"checkbox\" checked=\"{{f.signed}}\" onChange=\"{{fSigned}}\"/>I confirm this was administered as recorded (digital vet signature)<\/label>\n<div style=\"display: flex; justify-content: flex-end; gap: 10px\">\n<button type=\"button\" class=\"btn btn-s\" onClick=\"{{closeModal}}\">Cancel<\/button>\n<button type=\"button\" class=\"btn btn-p\" onClick=\"{{saveBatch}}\" disabled=\"{{cantSave}}\" style=\"opacity: {{saveOp}}\">Apply to {{applyCount}} pups<\/button>\n<\/div>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<\/div>\n",C:(function(DCLogic){
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.PUPS = [
      { n: 'Ruby', c: '#DC2626' }, { n: 'Cobalt', c: '#2563EB' }, { n: 'Olive', c: '#65A30D' },
      { n: 'Sunny', c: '#EAB308' }, { n: 'Lavender', c: '#8B5CF6' }, { n: 'Amber', c: '#EA580C' }
    ];
    const m = (done) => { const o = {}; this.PUPS.forEach(p => { o[p.n] = done[p.n] || null; }); return o; };
    this.state = {
      litterOpen: false, dark: false, modal: false,
      items: {
        dam: { kind: 'dw', wk: 'Dam protocol', date: 'Sep 1 – Oct 3', detail: 'Fenbendazole, late gestation', status: 'done' },
        w2: { kind: 'dw', wk: 'Week 2', date: 'Oct 16', detail: 'Pyrantel · dose by today’s weight', status: 'tomorrow' },
        w4: { kind: 'dw', wk: 'Week 4', date: 'Oct 29', detail: 'Pyrantel', status: 'up' },
        w6: { kind: 'dw', wk: 'Week 6', date: 'Nov 12', detail: 'Pyrantel + fecal check', status: 'up' },
        w8: { kind: 'dw', wk: 'Week 8', date: 'Nov 26', detail: 'Pyrantel · go-home dose', status: 'up' },
        v6: { kind: 'vx', wk: 6, name: 'DHPP #1 + Parvo', note: 'Given at breeder’s clinic with vet exam', date: 'Nov 12', status: 'up' },
        v9: { kind: 'vx', wk: 9, name: 'DHPP #2', note: 'Owner’s vet · reminder sent to buyers', date: 'Dec 3', status: 'up' },
        v12: { kind: 'vx', wk: 12, name: 'DHPP #3', note: 'Owner’s vet · reminder sent to buyers', date: 'Dec 24', status: 'up' }
      },
      history: [
        { what: 'Dam fenbendazole course · Luna', meta: 'Lot FB-1180 · Sep 1 – Oct 3 · signed [VET NAME]', fresh: false },
        { what: 'Day 3 vet exam · all 6 pups', meta: 'Oct 4 · dewclaws checked, no cleft palates · signed [VET NAME]', fresh: false }
      ],
      ms: {
        eyes: m({ Ruby: 11, Cobalt: 10, Olive: 12, Sunny: 13, Lavender: 12, Amber: 11 }),
        ears: m({ Cobalt: 13, Ruby: 14, Amber: 14 }),
        steps: m({ Cobalt: 14 }),
        solid: m({}),
        potty: m({}),
        ens: m({})
      },
      f: this.blank()
    };
  }
  blank() { return { item: 'w2', lot: '', date: '2026-10-16', vet: '[VET NAME], DVM', signed: false, apply: { Ruby: true, Cobalt: true, Olive: true, Sunny: true, Lavender: true, Amber: true } }; }
  renderVals() {

    const pill = st => st === 'done' ? { status: 'Completed', pillBg: '#DCFCE7', pillInk: '#166534', bg: '#FFFFFF', border: '#E2E8F0' }

      : { status: 'Upcoming', pillBg: '#F1F5F9', pillInk: '#334155', bg: '#FFFFFF', border: '#E2E8F0' };
    const keys = Object.keys(s.items);
    const deworm = keys.filter(k => s.items[k].kind === 'dw').map(k => Object.assign({}, s.items[k], pill(s.items[k].status)));
    const vax = keys.filter(k => s.items[k].kind === 'vx').map(k => Object.assign({}, s.items[k], pill(s.items[k].status)));
    const MS = [
      { k: 'eyes', title: 'Eyes opened', window: 'Expected Day 10–14', icon: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', iconBg: '#DBEAFE', iconInk: '#1E40AF' },
      { k: 'ears', title: 'Ears opened', window: 'Expected Day 13–17', icon: 'M7 10a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 0 M10 10a2 2 0 0 1 4 0', iconBg: '#EDE9FE', iconInk: '#5B21B6' },
      { k: 'steps', title: 'First steps / standing', window: 'Expected Day 14–18', icon: 'M8 16c0-2 2-3 4-3s4 1 4 3-2 3-4 3-4-1-4-3z M6 11a1.5 1.5 0 1 0 0.1 0 M18 11a1.5 1.5 0 1 0 0.1 0 M9.5 7a1.5 1.5 0 1 0 0.1 0 M14.5 7a1.5 1.5 0 1 0 0.1 0', iconBg: '#FFEDD5', iconInk: '#9A3412' },
      { k: 'solid', title: 'Solid food accepted', window: 'Expected Day 21', icon: 'M3 11h18a9 9 0 0 1-18 0z M8 7c0-1 1-2 2-2 M13 7c0-1 1-2 2-2', iconBg: '#ECFCCB', iconInk: '#3F6212' },
      { k: 'potty', title: 'Potty pad training began', window: 'Expected Day 25', icon: 'M4 4h16v16H4z M4 12h16 M12 4v16', iconBg: '#CCFBF1', iconInk: '#115E59' },
      { k: 'ens', title: 'Early Neurological Stimulation', window: 'Daily Day 3–16 · 12 of 14 sessions logged', icon: 'M3 12h4l3-8 4 16 3-8h4', iconBg: '#FCE7F3', iconInk: '#9D174D' }

      const count = this.PUPS.filter(p => rec[p.n]).length;
      return Object.assign({}, m, {

          n: p.n, c: p.c, done: !!rec[p.n],
          day: rec[p.n] ? 'Day ' + rec[p.n] : '—', dayInk: rec[p.n] ? '#166534' : '#94A3B8',
          toggle: () => {
            const cur = this.state.ms[m.k];

        }))
      });
    });
    const f = s.f;
    const applyCount = this.PUPS.filter(p => f.apply[p.n]).length;
    const setF = k => e => this.setState({ f: Object.assign({}, this.state.f, { [k]: e.target.value }) });
    const itemOpts = keys.filter(k => k !== 'dam' && s.items[k].status !== 'done').map(k => {
      const it = s.items[k];
      return { v: k, label: it.kind === 'dw' ? 'Deworming · ' + it.wk + ' (' + it.date + ')' : it.name + ' · ' + it.wk + ' wks (' + it.date + ')' };
    });
    return {
      deworm, vax, milestones,
      history: s.history.map(h => Object.assign({}, h, { bg: h.fresh ? '#F0FDFA' : '#F8FAFC' })),
      modal: s.modal, f, itemOpts, applyCount,
      cantSave: !f.signed || !f.lot || applyCount === 0,
      saveOp: (!f.signed || !f.lot || applyCount === 0) ? 0.5 : 1,
      applyPups: this.PUPS.map(p => ({ n: p.n, c: p.c, on: !!f.apply[p.n], toggle: () => this.setState({ f: Object.assign({}, this.state.f, { apply: Object.assign({}, this.state.f.apply, { [p.n]: !this.state.f.apply[p.n] }) }) }) })),
      fItem: setF('item'), fLot: setF('lot'), fDate: setF('date'), fVet: setF('vet'),
      fSigned: () => this.setState({ f: Object.assign({}, this.state.f, { signed: !this.state.f.signed }) }),
      openModal: () => this.setState({ modal: true, f: this.blank() }),

        const f2 = this.state.f;
        const it = this.state.items[f2.item];

          history: [{ what: (it.kind === 'dw' ? 'Deworming ' + it.wk : it.name) + ' · ' + (names.length === 6 ? 'all 6 pups' : names.join(', ')), meta: 'Lot ' + f2.lot + ' · ' + ds + ' · signed ' + f2.vet, fresh: true }].concat(this.state.history)

      },

      toggleLitter: () => this.setState({ litterOpen: !this.state.litterOpen }),
      dark: s.dark,
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
      themeTrack: s.dark ? '#0F766E' : '#CBD5E1',
      themeKnob: s.dark ? '18px' : '2px'
    };
  }
}

return Component;})(DCLogic)},
